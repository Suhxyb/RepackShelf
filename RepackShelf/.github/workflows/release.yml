name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stamp version and repository into the script
        shell: powershell
        run: |
          $ver = '${{ github.ref_name }}'.TrimStart('v')
          $f = 'src/RepackShelf.ps1'
          $t = (Get-Content $f -Raw).Replace('__VERSION__', $ver).Replace('__REPO__', '${{ github.repository }}')
          Set-Content $f $t -Encoding ASCII
          [IO.File]::AppendAllText($env:GITHUB_ENV, "VERSION=$ver`n")

      - name: Build exe
        shell: powershell
        run: ./build/Build-Exe.ps1 -Version $env:VERSION

      - name: Create checksum
        shell: powershell
        run: |
          $h = (Get-FileHash dist/RepackShelf.exe -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("$PWD/dist/RepackShelf.exe.sha256", "$h  RepackShelf.exe")

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/RepackShelf.exe
            dist/RepackShelf.exe.sha256
          generate_release_notes: true
